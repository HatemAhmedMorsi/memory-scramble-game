<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Scramble - Pro Edition</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        #setup-screen {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
        }

        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        
        button { 
            width: 100%; 
            padding: 12px; 
            background: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background: #2ecc71; }

        #game-container { width: 100%; max-width: 1200px; }
        
        #grid {
            display: grid;
            gap: 8px;
            margin: 20px auto;
            perspective: 1000px;
            justify-content: center;
            max-width: 95vw;
        }

        .card {
            aspect-ratio: 3/4;
            width: 100%;
            
            max-width: 80px; 
            min-width: 35px; 
            position: relative;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .card.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            font-size: clamp(14px, 2vw, 24px);   
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-front { background: #34495e; color: white; z-index: 2; }
        .card-back { background: #e74c3c; transform: rotateY(180deg); }

        
        #result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 280px;
        }
    </style>
  <script type="module" crossorigin src="/memory-scramble-game/assets/index-bd16d52c.js"></script>
</head>
<body>

    <div id="setup-screen">
        <h1>Memory Scramble</h1>
        <div class="input-group">
            <label>Rows:</label>
            <input type="number" id="input-rows" value="4" min="2">
        </div>
        <div class="input-group">
            <label>Columns:</label>
            <input type="number" id="input-cols" value="4" min="2">
        </div>
        <div class="input-group">
            <label>Time (sec):</label>
            <input type="number" id="input-time" value="60" min="5">
        </div>
        <button id="start-btn">Start Mission</button>
    </div>

    <div id="game-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; width: 100%; max-width: 500px; margin: 0 auto;">
            <h2 id="timer">Time: 0s</h2>
            <h2 id="score">Matches: 0</h2>
        </div>
        <div id="grid"></div>
    </div>

    <div id="result-modal">
        <div class="modal-content">
            <h1 id="result-message">Victory!</h1>
            <button id="restart-btn" style="background: #3498db;">Play Again</button>
        </div>
    </div>

    
</body>
</html>
